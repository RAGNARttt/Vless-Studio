plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ragnar.vlessstudio'
    compileSdk 35

    signingConfigs {
        release {
            def ksPath = System.getenv("VLESS_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("VLESS_STORE_PASSWORD")
                keyAlias System.getenv("VLESS_KEY_ALIAS")
                keyPassword System.getenv("VLESS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("VLESS_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
        applicationId 'com.ragnar.vlessstudio'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

dependencies {
    implementation files('libs/libXray.aar')
}
