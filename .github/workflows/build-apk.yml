name: Build VLESS Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Build libXray
        run: |
          git clone --depth 1 https://github.com/XTLS/libXray.git
          cd libXray
          python3 - <<'PY'
          from pathlib import Path
          p = Path("share/transport_build.go")
          s = p.read_text()
          s = s.replace('"encoding/json"\n', '"encoding/json"\n\t"bytes"\n\t"math"\n')
          s = s.replace('"strconv"\n', '"strconv"\n')
          old = '''\t\tif t.ExtraJSON != "" {
          \t\t\tif err := json.Unmarshal([]byte(t.ExtraJSON), &xhttpSettings.Extra); err != nil {
          \t\t\t\treturn nil, err
          \t\t\t}
          \t\t}'''
          new = '''\t\tif t.ExtraJSON != "" {
          \t\t\tnormalized, err := normalizeIntegralJSONNumbers([]byte(t.ExtraJSON))
          \t\t\tif err != nil {
          \t\t\t\treturn nil, err
          \t\t\t}
          \t\t\tif err := json.Unmarshal(normalized, &xhttpSettings.Extra); err != nil {
          \t\t\t\treturn nil, err
          \t\t\t}
          \t\t}'''
          if old not in s:
              raise SystemExit("Could not find XHTTP extra parser to patch")
          s = s.replace(old, new, 1)
          s += '''
          
          // normalizeIntegralJSONNumbers accepts integer-valued JSON numbers such as
          // 64.0 in XHTTP share-link extras where Go config fields are integer types.
          func normalizeIntegralJSONNumbers(raw []byte) ([]byte, error) {
          \tdecoder := json.NewDecoder(bytes.NewReader(raw))
          \tdecoder.UseNumber()
          \tvar value any
          \tif err := decoder.Decode(&value); err != nil {
          \t\treturn nil, err
          \t}
          \tvar normalize func(any) any
          \tnormalize = func(v any) any {
          \t\tswitch item := v.(type) {
          \t\tcase json.Number:
          \t\t\tif i, err := item.Int64(); err == nil {
          \t\t\t\treturn i
          \t\t\t}
          \t\t\tif f, err := item.Float64(); err == nil && !math.IsInf(f, 0) && !math.IsNaN(f) && math.Trunc(f) == f && f >= math.MinInt64 && f < math.MaxInt64 {
          \t\t\t\treturn int64(f)
          \t\t\t}
          \t\t\treturn item
          \t\tcase []any:
          \t\t\tfor i := range item { item[i] = normalize(item[i]) }
          \t\tcase map[string]any:
          \t\t\tfor key := range item { item[key] = normalize(item[key]) }
          \t\t}
          \t\treturn v
          \t}
          \treturn json.Marshal(normalize(value))
          }
          '''
          p.write_text(s)
          PY
          # libXray.RunXray does not read the custom top-level "env" field.
          # Apply those values to the Go process environment before core.New starts
          # the Android TUN inbound, which reads xray.tun.fd via os.Getenv.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("xray/xray.go")
          s = p.read_text()
          if '"encoding/json"' not in s:
              s = s.replace('import (\n', 'import (\n\t"encoding/json"\n\t"os"\n', 1)
          old = '''func RunXray(xrayJSON string) error {
          	coreServerMu.Lock()
          	defer coreServerMu.Unlock()
          	if coreServer != nil {'''
          new = '''func RunXray(xrayJSON string) error {
          	coreServerMu.Lock()
          	defer coreServerMu.Unlock()
          	var envConfig struct {
          		Env map[string]string `json:"env"`
          	}
          	if err := json.Unmarshal([]byte(xrayJSON), &envConfig); err != nil {
          		return err
          	}
          	for key, value := range envConfig.Env {
          		if err := os.Setenv(key, value); err != nil {
          			return err
          		}
          	}
          	if coreServer != nil {'''
          if old not in s:
              raise SystemExit("Could not find RunXray function to patch")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python3 build/main.py android
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/

      - name: Inspect libXray Android bindings
        run: |
          unzip -p app/libs/libXray.aar classes.jar > /tmp/libXray-classes.jar
          echo "=== Generated Java binding classes ==="
          jar tf /tmp/libXray-classes.jar | grep -E 'LibXray|DialerController|Seq' | head -80
          echo "=== LibXray public API ==="
          javap -classpath /tmp/libXray-classes.jar -public libXray.DialerController 2>/dev/null || true
          javap -classpath /tmp/libXray-classes.jar -public libXray.LibXray 2>/dev/null || true
          javap -classpath /tmp/libXray-classes.jar -public libXray.LibXray 2>/dev/null || true
          javap -classpath /tmp/libXray-classes.jar -public go.libxray.LibXray 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle Tailwind CSS for offline Android WebView
        run: |
          cat > tailwind.config.cjs <<'EOF'
          module.exports = {
            content: ['./app/src/main/assets/index.html'],
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  brand: { 50: '#eef2ff', 100: '#e0e7ff', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' },
                  cyber: { dark: '#0b0f19', card: 'rgba(17, 24, 39, 0.7)', accent: '#00f0ff', purple: '#7000ff', green: '#10b981' }
                }
              }
            },
            safelist: [
              { pattern: /^(bg|text|border|ring|from|to|via)-(brand|red|green|emerald|amber|slate|gray|white|black)-(50|100|200|300|400|500|600|700|800|900)$/ },
              'hidden','flex','grid','block','inline-flex'
            ],
            plugins: []
          };
          EOF
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind.input.css
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o app/src/main/assets/tailwind.css --minify
          test -s app/src/main/assets/tailwind.css
          echo "Bundled Tailwind CSS: $(wc -c < app/src/main/assets/tailwind.css) bytes"

      - name: Configure persistent APK signing
        if: ${{ secrets.VLESS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VLESS_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/vless-studio-release.jks"
          echo "VLESS_KEYSTORE_PATH=$RUNNER_TEMP/vless-studio-release.jks" >> "$GITHUB_ENV"
          echo "VLESS_STORE_PASSWORD=${{ secrets.VLESS_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VLESS_KEY_PASSWORD=${{ secrets.VLESS_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VLESS_KEY_ALIAS=${{ secrets.VLESS_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLESS-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
