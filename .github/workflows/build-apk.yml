name: Build VLESS Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Build libXray
        run: |
          git clone --depth 1 https://github.com/XTLS/libXray.git
          cd libXray
          python3 build/main.py android
          mkdir -p ../app/libs
          cp libXray.aar ../app/libs/

      - name: Inspect libXray Android bindings
        run: |
          unzip -p app/libs/libXray.aar classes.jar > /tmp/libXray-classes.jar
          echo "=== Generated Java binding classes ==="
          jar tf /tmp/libXray-classes.jar | grep -E 'LibXray|DialerController|Seq' | head -80
          echo "=== LibXray public API ==="
          javap -classpath /tmp/libXray-classes.jar -public go.libXray.LibXray 2>/dev/null || true
          javap -classpath /tmp/libXray-classes.jar -public libXray.LibXray 2>/dev/null || true
          javap -classpath /tmp/libXray-classes.jar -public go.libxray.LibXray 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLESS-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
